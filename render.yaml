services:
  - type: web
    name: dentiflow
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: /data/dentiflow.db
      - key: RENDER
        value: "true"
      - key: CLINIC_NAME
        value: DentiFlow Dental Care
      - key: CLINIC_CURRENCY
        value: USD
      - key: CLINIC_TAX_RATE
        value: "5.0"
    disk:
      name: dentiflow-data
      mountPath: /data
      sizeGB: 1
