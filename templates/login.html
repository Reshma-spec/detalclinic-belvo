<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DentiFlow Clinic Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        .login-logo-icon {
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container p-3">
        <div class="login-card mx-auto">
            <div class="login-header">
                <div class="login-logo-icon">
                    <i class="fas fa-tooth"></i>
                </div>
                <h3 class="fw-bold mb-1">DentiFlow</h3>
                <p class="mb-0 small opacity-75">Dental Clinic Owner Management System</p>
            </div>
            
            <div class="p-4">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">USERNAME OR EMAIL</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" id="usernameInput" class="form-control" placeholder="e.g. admin or admin@dentiflow.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="passwordInput" class="form-control" placeholder="????????" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                        <i class="fas fa-right-to-bracket me-2"></i>Sign In to Workspace
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top">
                    <div class="text-muted small fw-semibold mb-2 text-center text-uppercase">Demo Development Credentials</div>
                    <div class="d-flex flex-column gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary d-flex justify-content-between align-items-center" onclick="fillCreds('admin', 'admin123')">
                            <span><i class="fas fa-crown text-warning me-2"></i><strong>Admin / Clinic Owner</strong></span>
                            <span class="badge bg-light text-dark">admin123</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary d-flex justify-content-between align-items-center" onclick="fillCreds('dr.smith', 'doctor123')">
                            <span><i class="fas fa-user-doctor text-info me-2"></i><strong>Dr. Smith (Doctor)</strong></span>
                            <span class="badge bg-light text-dark">doctor123</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary d-flex justify-content-between align-items-center" onclick="fillCreds('reception', 'reception123')">
                            <span><i class="fas fa-headset text-success me-2"></i><strong>Front Desk Receptionist</strong></span>
                            <span class="badge bg-light text-dark">reception123</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(username, password) {
            document.getElementById('usernameInput').value = username;
            document.getElementById('passwordInput').value = password;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
