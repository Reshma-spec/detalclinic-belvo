{% extends "base.html" %}
{% block title %}500 - System Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-warning">500</h1>
    <h3 class="fw-bold text-dark">Internal Server Error</h3>
    <p class="text-muted">An unexpected error occurred while processing your clinical request. Please try again.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary rounded-pill px-4"><i class="fas fa-house me-2"></i>Return to Dashboard</a>
</div>
{% endblock %}
